plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}
group = 'com.studentservices'
version = '1.0'
repositories {
    mavenCentral()
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
javafx {
    version = '21'
    modules = [
            'javafx.controls',
            'javafx.fxml'
    ]
}
application {
    mainClass = 'com.studentservices.Main'
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}
test {
    useJUnitPlatform()
}